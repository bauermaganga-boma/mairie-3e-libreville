<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#06363f">
<title>Espace des agents – Mairie du 3e arrondissement de Libreville</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo-lbv.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/backoffice.css">
</head>
<body data-page="espace">
<div class="flagbar"></div>
<div id="site-header"></div>

<div class="auth">
  <div class="side">
    <img id="side-img" src="assets/img/front-de-mer.jpg" alt="">
    <span class="eyebrow">Mairie du 3e arrondissement</span>
    <h2 id="side-title">Piloter le 3e arrondissement en temps réel.</h2>
    <p id="side-text"></p>
  </div>
  <div class="main">
    <div class="box">
      <h1>Espace des agents du 3e</h1>
      <p style="color:var(--muted)">Accès réservé au personnel de la mairie du 3e arrondissement de Libreville.</p>
      <div class="role-sw" role="tablist" aria-label="Choisir votre espace">
        <button type="button" data-role="cabinet" class="on" role="tab" aria-selected="true">Cabinet</button>
        <button type="button" data-role="services" role="tab" aria-selected="false">Services</button>
        <button type="button" data-role="recettes" role="tab" aria-selected="false">Recettes</button>
      </div>
      <form class="form" id="login-form">
        <div class="field"><label for="login">Identifiant</label><input id="login" name="login" required autocomplete="username" autocapitalize="none" spellcheck="false"></div>
        <div class="field"><label for="pwd">Mot de passe</label><span class="pwd-wrap"><input id="pwd" name="pwd" type="password" required autocomplete="current-password"><button type="button" class="pwd-eye" id="pwd-eye" aria-label="Afficher le mot de passe" aria-pressed="false">Afficher</button></span></div>
        <button class="btn btn-navy" type="submit" style="justify-content:center">Se connecter</button>
      </form>
      <div class="demo" id="demo"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/main.js"></script>
<script>
(() => {
  const cfg = {
    cabinet: {img:"maire", t:"Piloter le 3e arrondissement en temps réel.", p:"Tableau de bord, indicateurs par quartier et par service, recettes, alertes automatiques, dotation 2026 et chantiers de la mairie du 3e arrondissement.",
      demo:[["maire","3e2026","Cabinet du maire — accès complet"],["secretariat","admin2026","Secrétariat général — accès complet + comptes"]]},
    services: {img:"conseil-municipal", t:"Chaque service, son outil.", p:"État civil, services techniques, ressources humaines : chacun traite ses dossiers et tout reste tracé, conformément aux recommandations de l'audit.",
      demo:[["etat.civil","agent2026","État civil — demandes, rendez-vous, registre"],["services.techniques","agent2026","Services techniques — signalements, chantiers"],["rh","agent2026","Ressources humaines — dossiers du personnel"]]},
    recettes: {img:"vignette-0001", t:"Chaque franc tracé.", p:"Encaissements et quittances, paiements e-Tax, droits de place des marchés du 3e (Mont-Bouët…), registre des vignettes à QR code et contrôle sur le terrain par scan.",
      demo:[["recettes","agent2026","Direction des recettes — e-Tax, vignettes, marchés"]]},
  };
  const ALIAS = {arrondissement:"cabinet"};
  let role = new URLSearchParams(location.search).get("role");
  if (ALIAS[role]) role = ALIAS[role];
  if (!cfg[role]) role = "cabinet";
  const set = r => {
    role = r; const c = cfg[r];
    document.querySelectorAll(".role-sw button").forEach(b => { const on = b.dataset.role === r; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    document.getElementById("side-img").src = `assets/img/${c.img}.jpg`;
    document.getElementById("side-title").textContent = c.t; document.getElementById("side-text").textContent = c.p;
    const dm = document.getElementById("demo"); dm.style.display = (window.ESM_CONFIG || {}).showDemo === false ? "none" : "";
    dm.innerHTML = `<b>Comptes de démonstration</b> — cliquez sur un compte pour le tester :` + c.demo.map(([l, p, n]) => `<div class="acc"><button type="button" class="demo-fill" data-l="${l}" data-p="${p}" aria-label="Tester le compte ${l}"><code>${l}</code> / <code>${p}</code></button> <span>${n}</span></div>`).join("");
  };
  document.querySelector(".role-sw").addEventListener("click", e => { const b = e.target.closest("button"); if (b) set(b.dataset.role); });
  document.getElementById("demo").addEventListener("click", e => { const c = e.target.closest("[data-l]"); if (!c) return; document.getElementById("login").value = c.dataset.l; document.getElementById("pwd").value = c.dataset.p; document.getElementById("login-form").requestSubmit(); });
  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Connexion…";
    let u = null;
    try { u = await Store.login(e.target.login.value, e.target.pwd.value); } catch (err) { toast("Connexion au serveur impossible.", "err"); }
    btn.disabled = false; btn.textContent = "Se connecter";
    if (!u) return toast("Identifiant ou mot de passe incorrect.", "err");
    toast(`Bienvenue — ${u.titre || u.prenom} !`, "ok");
    setTimeout(() => location.href = "agents.html", 500);
  });
  document.getElementById("pwd-eye").onclick = ev => { const i = document.getElementById("pwd"), sh = i.type === "password"; i.type = sh ? "text" : "password"; ev.currentTarget.textContent = sh ? "Masquer" : "Afficher"; ev.currentTarget.setAttribute("aria-pressed", sh); ev.currentTarget.setAttribute("aria-label", sh ? "Masquer le mot de passe" : "Afficher le mot de passe"); };
  set(role);
  const P = new URLSearchParams(location.search), E = (typeof ESPACES !== "undefined" ? ESPACES : []).find(x => x.role === role);
  if (P.get("demo") === "1" && E && (window.ESM_CONFIG || {}).showDemo !== false) {
    document.getElementById("login").value = E.demo.login; document.getElementById("pwd").value = E.demo.pwd;
    toast(`Connexion à l'espace de démonstration « ${E.t} »…`);
    setTimeout(() => document.getElementById("login-form").requestSubmit(), 700);
  }
})();
</script>
</body>
</html>
